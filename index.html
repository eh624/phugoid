<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phugoid Simulator</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd5;--ac:#2a6fdb;--ac2:#e0713a;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#a0a09a;--bd:#3a3a37;--ac:#6aa3ff;--ac2:#ff9a66;--ok:#5ccf93}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#a0a09a;--bd:#3a3a37;--ac:#6aa3ff;--ac2:#ff9a66;--ok:#5ccf93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.gl{font-weight:500;color:var(--mu);font-size:.65em;letter-spacing:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
.lang{padding:6px 12px;font-size:13px;white-space:nowrap;letter-spacing:.04em}
.lang span{color:var(--mu)}
.lang span.on{color:var(--ac);font-weight:700}
.mx{font-size:13px;color:var(--tx);margin:6px 0 0;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
canvas{width:100%;display:block;border-radius:8px}#cv{height:300px}#cv2{height:180px}#cv3,#cv4{height:240px;cursor:crosshair}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
label{display:block;font-size:13px;color:var(--mu)}
label b{color:var(--tx);float:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.res{display:flex;flex-wrap:wrap;gap:20px}
.res div{font-size:12px;color:var(--mu)}
.res strong{display:block;font-size:22px;color:var(--tx);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.leg span{display:inline-block;margin-right:12px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<main>
<div class="head"><h1><span data-i="title"></span> <span class="gl" data-i="glider"></span></h1><button id="lang" class="lang" type="button"></button></div>
 
<div class="card">
<canvas id="cv" height="300"></canvas>
<div class="row">
<button class="p" id="play" data-i="play"></button>
</div>
</div>
 
<div class="card">
<div class="res">
<div><span data-i="range"></span><strong id="rng">–</strong></div>
<div><span data-i="time"></span><strong id="tm">–</strong></div>
<div><span data-i="hmax"></span><strong id="hmax">–</strong></div>
</div>
<div class="note" id="msg"></div>
</div>
 
<div class="card">
<div class="grid">
<label><span data-i="lv"></span><b id="vV"></b><input id="v" type="range" min="2" max="12" step="0.1" value="5"></label>
<label><span data-i="la"></span><b id="aV"></b><input id="a" type="range" min="-60" max="60" step="0.1" value="16.5"></label>
<label><span data-i="lh"></span><b id="hV"></b><input id="h" type="range" min="0.5" max="3" step="0.1" value="1.8"></label>
<label><span data-i="ll"></span><b id="lV"></b><input id="l" type="range" min="0" max="0.5" step="0.005" value="0.2"></label>
<label><span data-i="ld"></span><b id="dV"></b><input id="d" type="range" min="0" max="0.1" step="0.0005" value="0.025"></label>
<label><span data-i="lt"></span><b id="tV"></b><input id="t" type="range" min="0.0005" max="0.02" step="0.0005" value="0.001"></label>
</div>
<div class="row">
<button id="scan" data-i="scan"></button>
<button id="reset" data-i="reset"></button>
</div>
<div class="note"><span data-i="eq"></span> v′ = −(d/m)v² − g sinθ, θ′ = (l/m)v − g cosθ / v, h′ = v sinθ, x′ = v cosθ (g = 9.81)</div>
</div>
 
<div class="card">
<canvas id="cv2" height="180"></canvas>
<div class="leg" style="margin-top:6px"><span><i style="background:var(--ac)"></i><em data-i="legv" style="font-style:normal"></em></span><span><i style="background:var(--ac2)"></i><em data-i="lega" style="font-style:normal"></em></span></div>
</div>
<div class="card">
<canvas id="cv3" height="240"></canvas>
<div class="mx" id="mx3"></div>
<canvas id="cv4" height="240" style="margin-top:14px"></canvas>
<div class="mx" id="mx4"></div>
<div class="note" data-i="gnote"></div>
</div>
</main>
 
<script>
const $=id=>document.getElementById(id), G=9.81;
const P={v:5,a:16.5,h:1.8,l:0.2,d:0.025,t:0.001};
const fmt={v:x=>x.toFixed(1),a:x=>x.toFixed(1)+'°',h:x=>x.toFixed(1),l:x=>x.toFixed(3),d:x=>x.toFixed(4),t:x=>x.toFixed(4)};
let path=[],res=null,anim=null,prog=1;
const T={
ko:{title:'푸고이드 시뮬레이터',glider:'(글라이더)',play:'▶ 날려보기',range:'비거리',time:'비행 시간',hmax:'최고 고도',lv:'초기 속도 v₀ (m/s)',la:'발사각 θ₀ (°)',lh:'발사 높이 h₀ (m)',ll:'l/m 양력 계수 (m⁻¹)',ld:'d/m 항력 계수 (m⁻¹)',lt:'시간 간격 Δt (s)',scan:'이 조건에서 최적 발사각 찾기',reset:'초기화',eq:'식:',legv:'속도 v (m/s)',lega:'활공각 θ (°)',gnote:'현재 속도·높이·계수 기준으로 −60°~60°를 0.25° 간격으로 계산한 그래프예요(위: 비거리, 아래: 체공시간). 그래프를 누르면 그 각도로 날려봐요. (속도, 높이, l/m, d/m를 바꾸면 다시 계산돼요)',alt:'고도 (m)',noland:'계산 불가',gr:'발사각별 비거리 (m)',gt:'발사각별 체공시간 (s)',spd:'속도',mr:'최대 비거리',mt:'최대 체공시간',at:'발사각',nomax:'착지하는 각도가 없어요',nl:'착지하기 전에 계산이 끝났어요(속도가 거의 0이 되었거나 계속 날고 있어요). 조건을 바꿔보세요.',err:'오류: ',finding:'찾는 중…',best:(a,b)=>'최적 발사각 ≈ '+a+'° (비거리 '+b+' m). 슬라이더는 0.1° 단위라 가장 가까운 값으로 맞췄어요.',btn:'English'},
en:{title:'Phugoid Simulator',glider:'(glider)',play:'▶ Fly',range:'Range',time:'Flight time',hmax:'Max altitude',lv:'Initial speed v₀ (m/s)',la:'Launch angle θ₀ (°)',lh:'Launch height h₀ (m)',ll:'l/m lift coefficient (m⁻¹)',ld:'d/m drag coefficient (m⁻¹)',lt:'Time step Δt (s)',scan:'Find optimal launch angle',reset:'Reset',eq:'Equations:',legv:'Speed v (m/s)',lega:'Flight path angle θ (°)',gnote:'Computed for −60° to 60° in 0.25° steps using the current speed, height and coefficients (top: range, bottom: flight time). Click a graph to fly at that angle. (Changing speed, height, l/m or d/m recalculates.)',alt:'Altitude (m)',noland:'Cannot calculate',gr:'Range by launch angle (m)',gt:'Flight time by launch angle (s)',spd:'Speed',mr:'Max range',mt:'Max flight time',at:'launch angle',nomax:'No landing angle found',nl:'The calculation ended before landing (speed dropped near zero or it is still flying). Try changing the conditions.',err:'Error: ',finding:'Searching…',best:(a,b)=>'Optimal launch angle ≈ '+a+'° (range '+b+' m). The slider steps by 0.1°, so it was set to the nearest value.',btn:'한국어'}
};
let L='ko';try{if(localStorage.getItem('lang')==='en')L='en'}catch(e){}
let mk=null,ma=[];
function setMsg(k,...a){mk=k;ma=a;renderMsg()}
function renderMsg(){const v=mk?T[L][mk]:'';$('msg').textContent=typeof v==='function'?v(...ma):v+(ma[0]&&mk==='err'?ma[0]:'')}
function renderRes(){if(!res)return;$('rng').textContent=res.ok?res.range.toFixed(3)+' m':T[L].noland;$('tm').textContent=res.time.toFixed(2)+' s';$('hmax').textContent=res.hmax.toFixed(2)+' m';$('tm').parentElement.style.display=$('hmax').parentElement.style.display=res.ok?'':'none'}
function applyLang(){
  document.documentElement.lang=L;document.title=T[L].title;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=T[L][e.dataset.i]});
  $('lang').innerHTML='<span'+(L==='en'?' class="on"':'')+'>EN</span> / <span'+(L==='ko'?' class="on"':'')+'>KOR</span>';
  renderRes();renderMsg();draw();drawPlot();drawRange();
}
 
 
const TMAX=120;
function sim(v0,deg,h0,l,d,dt,keep,tmax){
  let v=v0,th=deg*Math.PI/180,h=h0,x=0,t=0,hm=h0,pts=keep?[[0,h0,t,v,th]]:null;
  const N=Math.ceil((tmax||TMAX)/dt),every=Math.max(1,Math.round(0.01/dt));
  for(let i=0;i<N;i++){
    const vn=v+(-d*v*v-G*Math.sin(th))*dt;
    const tn=th+(l*v-G*Math.cos(th)/v)*dt;
    const hn=h+v*Math.sin(th)*dt;
    const xn=x+v*Math.cos(th)*dt;
    t+=dt;
    if(hn<0){const f=h/(h-hn);const X=x+(xn-x)*f;
      if(keep)pts.push([X,0,t-dt+dt*f,v+(vn-v)*f,th+(tn-th)*f]);
      return{range:X,time:t-dt+dt*f,hmax:hm,pts,ok:true}}
    v=vn;th=tn;h=hn;x=xn;if(h>hm)hm=h;
    if(keep&&i%every===0)pts.push([x,h,t,v,th]);
    if(!(v>0.05)||!isFinite(th)||x>1000)return{range:x,time:t,hmax:hm,pts,ok:false}
  }
  return{range:x,time:t,hmax:hm,pts,ok:false}
}
 
function run(){
  try{
    res=sim(P.v,P.a,P.h,P.l,P.d,P.t,true);path=res.pts;
    renderRes();setMsg(res.ok?null:'nl');
    drawPlot();calcRange();drawRange();play();
  }catch(e){setMsg('err',e.message)}
}
 
function setup(c){const r=c.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  if(!c.dataset.h)c.dataset.h=c.getAttribute('height');
  const hh=+c.dataset.h,W=Math.max(1,Math.round(r.width*dpr)),Hh=Math.round(hh*dpr);
  if(c.width!==W)c.width=W;
  if(c.height!==Hh)c.height=Hh;
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,hh);return{g,w:r.width,h:hh}}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
 
function draw(){
  const{g,w,h}=setup($('cv'));g.clearRect(0,0,w,h);
  if(!path.length)return;
  const pad=34;let X=1,H=1;
  path.forEach(p=>{if(p[0]>X)X=p[0];if(p[1]>H)H=p[1]});X*=1.05;H*=1.25;
  const sc=Math.min((w-pad*2)/X,(h-pad*1.6)/H);
  const ox=pad,oy=h-pad;
  const px=x=>ox+x*sc,py=y=>oy-y*sc;
  g.strokeStyle=css('--bd');g.fillStyle=css('--mu');g.font='11px sans-serif';g.lineWidth=1;
  g.beginPath();g.moveTo(ox,oy);g.lineTo(w-pad/2,oy);g.moveTo(ox,oy);g.lineTo(ox,pad/2);g.stroke();
  const step=X>100?20:X>40?10:X>12?2:X>5?1:0.5;
  for(let m=0;m<=X&&m<1000;m+=step){g.fillText(m+'m',px(m)-8,oy+14);g.beginPath();g.moveTo(px(m),oy);g.lineTo(px(m),oy+4);g.stroke()}
  g.fillText(T[L].alt,ox+4,pad/2+8);
  const n=Math.max(1,Math.floor((path.length-1)*prog));
  g.strokeStyle=css('--ac');g.lineWidth=2;g.beginPath();
  for(let i=0;i<=n;i++){const p=path[i];i?g.lineTo(px(p[0]),py(p[1])):g.moveTo(px(p[0]),py(p[1]))}
  g.stroke();
  const p=path[n];
  g.save();g.translate(px(p[0]),py(p[1]));g.rotate(-p[4]);
  g.fillStyle=css('--ac2');g.beginPath();g.moveTo(14,0);g.lineTo(-9,-6);g.lineTo(-5,0);g.lineTo(-9,6);g.closePath();g.fill();g.restore();
  if(prog>=1&&res.ok){g.fillStyle=css('--ok');g.beginPath();g.arc(px(res.range),oy,4,0,7);g.fill();
    g.fillText(res.range.toFixed(2)+' m',Math.min(px(res.range)-16,w-60),oy-10)}
}
 
function drawPlot(){
  const{g,w,h}=setup($('cv2'));g.clearRect(0,0,w,h);
  if(path.length<2)return;
  const pl=38,pr=38,pt=10,pb=22,T=res.time;
  const vs=path.map(p=>p[3]),ths=path.map(p=>p[4]*180/Math.PI);
  const mn=a=>a.reduce((s,x)=>x<s?x:s,Infinity),mx=a=>a.reduce((s,x)=>x>s?x:s,-Infinity);
  const vmin=mn(vs),vmax=mx(vs),amin=mn(ths),amax=mx(ths);
  const sx=t=>pl+t/T*(w-pl-pr);
  const sy=(y,a,b)=>h-pb-(y-a)/((b-a)||1)*(h-pb-pt);
  g.strokeStyle=css('--bd');g.fillStyle=css('--mu');g.font='11px sans-serif';
  g.strokeRect(pl,pt,w-pl-pr,h-pt-pb);
  g.fillText('0',pl-3,h-6);g.fillText(T.toFixed(1)+'s',w-pr-14,h-6);
  g.fillText(vmax.toFixed(1),4,pt+8);g.fillText(vmin.toFixed(1),4,h-pb);
  g.fillText(amax.toFixed(0)+'°',w-pr+3,pt+8);g.fillText(amin.toFixed(0)+'°',w-pr+3,h-pb);
  if(amin<0&&amax>0){const y=sy(0,amin,amax);g.setLineDash([3,3]);g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.setLineDash([])}
  [[vs,vmin,vmax,'--ac'],[ths,amin,amax,'--ac2']].forEach(([a,lo,hi,c])=>{
    g.strokeStyle=css(c);g.lineWidth=2;g.beginPath();
    path.forEach((p,i)=>{const X=sx(p[2]),Y=sy(a[i],lo,hi);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()})
}
 
let rk='',rd=[];
function calcRange(){
  const k=[P.v,P.h,P.l,P.d].join();
  if(k===rk)return;rk=k;rd=[];
  for(let a=-60;a<=60.0001;a+=0.25){
    const r=sim(P.v,a,P.h,P.l,P.d,P.t,false,25);
    rd.push([a,r.ok?r.range:null,r.ok?r.time:null]);
  }
}
function drawRange(){drawAG('cv3',1,T[L].gr,'m','mx3',T[L].mr);drawAG('cv4',2,T[L].gt,'s','mx4',T[L].mt)}
function drawAG(id,k,title,u,mid,mlab){
  const{g,w,h}=setup($(id));
  const pl=44,pr=14,pt=22,pb=28;
  let mx=0,best=null;
  rd.forEach(p=>{if(p[k]!==null&&p[k]>mx){mx=p[k];best=p}});
  const top=Math.max(1,mx)*1.1;
  const sx=a=>pl+(a+60)/120*(w-pl-pr),sy=r=>h-pb-r/top*(h-pb-pt);
  g.strokeStyle=css('--bd');g.fillStyle=css('--mu');g.font='11px sans-serif';g.lineWidth=1;
  g.strokeRect(pl,pt,w-pl-pr,h-pt-pb);
  for(let a=-60;a<=60;a+=20){g.fillText(a+'°',sx(a)-10,h-pb+14);g.beginPath();g.moveTo(sx(a),h-pb);g.lineTo(sx(a),h-pb+4);g.stroke()}
  for(let i=0;i<=4;i++){const r=top*i/4,y=sy(r);g.fillText(r.toFixed(1),4,y+4);if(i){g.setLineDash([2,3]);g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.setLineDash([])}}
  g.fillStyle=css('--tx');g.fillText(T[L].spd+' '+P.v.toFixed(1)+' m/s · '+title,pl,13);
  g.strokeStyle=css('--ac');g.lineWidth=2;g.beginPath();
  let pen=false;
  rd.forEach(p=>{if(p[k]===null){pen=false;return}const X=sx(p[0]),Y=sy(p[k]);pen?g.lineTo(X,Y):g.moveTo(X,Y);pen=true});
  g.stroke();
  g.setLineDash([4,3]);g.strokeStyle=css('--ac2');g.lineWidth=1;g.beginPath();g.moveTo(sx(P.a),pt);g.lineTo(sx(P.a),h-pb);g.stroke();g.setLineDash([]);
  if(best){g.fillStyle=css('--ok');g.beginPath();g.arc(sx(best[0]),sy(best[k]),4,0,7);g.fill()}
  $(mid).textContent=best?mlab+': '+best[k].toFixed(2)+' '+u+'  ·  '+T[L].at+' '+best[0].toFixed(2)+'°':T[L].nomax;
}
['cv3','cv4'].forEach(id=>$(id).addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left;
  const a=Math.round(((x-44)/(r.width-44-14)*120-60)*10)/10;
  if(a>=-60&&a<=60)setAll({a});
}));
function play(){
  cancelAnimationFrame(anim);prog=0;const t0=performance.now(),dur=Math.max(1200,Math.min(5000,res.time*1000));
  (function f(now){prog=Math.min(1,(now-t0)/dur);draw();if(prog<1)anim=requestAnimationFrame(f)})(t0);
}
 
['v','a','h','l','d','t'].forEach(k=>{
  const el=$(k),lab=$(k+'V');
  const upd=()=>{P[k]=+el.value;lab.textContent=fmt[k](P[k])};
  el.addEventListener('input',()=>{upd();cancelAnimationFrame(anim);prog=1;run()});upd();
});
function setAll(o){Object.assign(P,o);for(const k in o){$(k).value=o[k];$(k+'V').textContent=fmt[k](o[k])}cancelAnimationFrame(anim);prog=1;run()}
$('play').onclick=play;
$('reset').onclick=()=>setAll({v:5,a:16.5,h:1.8,l:0.2,d:0.025,t:0.001});
$('scan').onclick=()=>{
  setMsg('finding');
  setTimeout(()=>{
    let best=-1e9,ba=0;
    for(let a=-60;a<=60;a+=0.1){const r=sim(P.v,a,P.h,P.l,P.d,Math.max(P.t,0.005),false,25);
      if(r.ok&&r.range>best){best=r.range;ba=a}}
    let b2=-1e9,a2=ba;
    for(let a=ba-0.1;a<=ba+0.1001;a+=0.01){const r=sim(P.v,a,P.h,P.l,P.d,P.t,false,25);if(r.ok&&r.range>b2){b2=r.range;a2=a}}
    a2=Math.round(a2*100)/100;
    setAll({a:Math.round(a2*10)/10});
    setMsg('best',a2.toFixed(2),b2.toFixed(3));
    play();
  },20);
};
$('lang').onclick=()=>{L=L==='ko'?'en':'ko';try{localStorage.setItem('lang',L)}catch(e){}applyLang()};
window.addEventListener('resize',()=>{draw();drawPlot();drawRange()});
applyLang();
run();
</script>
</body>
</html>
